services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maragogi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - maragogi_postgres:/var/lib/postgresql/data
volumes:
  maragogi_postgres:
