services:
  - type: web
    name: partiu-maragogi-intelligence
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: partiu-maragogi-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: SYNC_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: INSTAGRAM_USERNAME
        sync: false
      - key: APIFY_DAILY_RUN_LIMIT
        value: 6
# DATABASE_URL accepts Render PostgreSQL or any compatible PostgreSQL 15+ instance.
# Migrations run at start; no preDeployCommand required.

databases:
  - name: partiu-maragogi-db
    databaseName: partiu_maragogi
    user: partiu_maragogi
    plan: free
